version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: zws-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-zwsvercel}
      MYSQL_USER: ${DB_USERNAME:-zwsvercel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-n8BtT2D3KdpTPPks}
      MYSQL_INITDB_SKIP_TZINFO: 'yes'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - zws-network

  redis:
    image: redis:7-alpine
    container_name: zws-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5
    networks:
      - zws-network

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: zws-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_NAME: ${APP_NAME:-zws}
      APP_URL: ${APP_URL:-http://localhost}
      DATABASE_URL: mysql://${DB_USERNAME:-zwsvercel}:${DB_PASSWORD:-n8BtT2D3KdpTPPks}@mysql:3306/${DB_DATABASE:-zwsvercel}
      JWT_SECRET: ${JWT_SECRET:-change-me-production-secret}
      REDIS_URL: redis://redis:6379
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@zws.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminPassword123}
    volumes:
      - ./app:/app/app
      - ./components:/app/components
      - ./lib:/app/lib
      - ./public:/app/public
      - ./prisma:/app/prisma
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health || exit 1"]
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - zws-network

  paymenter:
    build:
      context: ./docker/paymenter
      dockerfile: Dockerfile
    container_name: zws-paymenter
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-ZWS Cloud}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}/billing
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-zwsvercel}
      DB_USERNAME: ${DB_USERNAME:-zwsvercel}
      DB_PASSWORD: ${DB_PASSWORD:-n8BtT2D3KdpTPPks}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-me-production-secret}
      PAYMENTER_THEME: zws
    volumes:
      - paymenter_storage:/app/storage
      - paymenter_logs:/app/storage/logs
      - ./docker/paymenter/themes/zws:/app/themes/zws
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health || exit 1"]
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - zws-network

  nginx:
    image: nginx:alpine
    container_name: zws-nginx
    restart: unless-stopped
    depends_on:
      - app
      - paymenter
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./public:/usr/share/nginx/html/public:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - zws-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: zws-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: ${DB_USERNAME:-zwsvercel}
      PMA_PASSWORD: ${DB_PASSWORD:-n8BtT2D3KdpTPPks}
    ports:
      - "8888:80"
    depends_on:
      - mysql
    networks:
      - zws-network

volumes:
  mysql_data:
  redis_data:
  paymenter_storage:
  paymenter_logs:
  node_modules:

networks:
  zws-network:
    driver: bridge
